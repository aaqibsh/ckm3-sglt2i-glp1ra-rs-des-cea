name: Set up R for CKM-HEOR
description: Installs R 4.5.1 and the model's packages (precompiled binaries, cached), then checks versions.
runs:
  using: composite
  steps:
    - uses: r-lib/actions/setup-r@v2
      with:
        r-version: "4.5.1"
        use-public-rspm: true
    - uses: r-lib/actions/setup-r-dependencies@v2
      with:
        cache-version: 2
        # preventr is pinned to the version the PREVENT implementation was
        # validated against (pure R, installed from the CRAN archive)
        extra-packages: preventr@0.12.0
    - name: Check package versions
      shell: bash
      run: Rscript ci/check_versions.R
